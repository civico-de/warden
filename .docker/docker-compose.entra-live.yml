# Disposable CiviCRM + Warden stack for the live Entra ID E2E test. The
# browser runs on the host (Playwright), so the app is published on localhost
# — the only plain-http redirect URI Entra accepts.
name: warden-entra-live

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: civicrm
      MYSQL_USER: civicrm
      MYSQL_PASSWORD: civicrm
    volumes:
      - live-db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${CIVIKITCHEN_IMAGE:-ghcr.io/jfilter/civikitchen:v1}
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8087:80"
    environment:
      CIVICRM_AUTO_INSTALL: "1"
      CIVICRM_DB_HOST: db
      CIVICRM_DB_NAME: civicrm
      CIVICRM_DB_USER: civicrm
      CIVICRM_DB_PASSWORD: civicrm
      CIVIKITCHEN_SITE_URL: ${WARDEN_ENTRA_LIVE_SITE_URL:-http://localhost:8087}
      CIVIKITCHEN_ENABLE_EXTENSIONS: warden
    volumes:
      - ..:/var/www/html/ext/warden
      - ./init.d:/civikitchen-init.d:ro
    healthcheck:
      test: ["CMD-SHELL", "cv ev 'if (!class_exists(\"Civi\\\\Api4\\\\WardenProvider\") || !CRM_Core_DAO::checkTableExists(\"civicrm_warden_session\")) { throw new RuntimeException(\"warden not ready\"); }' >/dev/null 2>&1 && curl --fail --silent --output /dev/null http://127.0.0.1/civicrm/login"]
      interval: 5s
      timeout: 10s
      retries: 50
      start_period: 30s

volumes:
  live-db-data:
