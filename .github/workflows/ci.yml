# Thin caller: the actual pipeline lives in civikitchen's reusable
# extension-ci.yml (compose stack → cklint + ckconform → phpunit under
# ckcoverage → phpstan → template-drift check), so it is defined once instead
# of drifting between copy-pasted workflows. civikitchen is public — no
# cross-repo token needed.
#
# Repo-specific needs (a different compose file, a different image, skipping
# the drift check) go through the workflow's inputs (`with:`), not a fork of
# its steps.
#
# The @v1 pin is the versioned contract: workflow, template, ck* tools and
# images are released together, so this ref and the image tag in
# .docker/docker-compose.ci.yml move as one. Fixes arrive without a PR here;
# a change this repo has to react to ships as a minor marked Breaking in the
# changelog. See civikitchen's docs/releases.md.
#
# Everything up to the END marker is template-managed; what this repo needs
# beyond it — `with:` inputs for the call, further jobs — goes below the
# marker and survives `ckinit --update`.
# BEGIN CIVIKITCHEN MANAGED caller
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run: a reusable-workflow rerun reuses the ref it first resolved, so
  # picking up a moved civikitchen tag needs a fresh event.
  workflow_dispatch:

# The jobs only read the repo; do not inherit the org default token.
permissions:
  contents: read

# No inputs: the workflow reads the extension key from info.xml itself.
jobs:
  ci:
    uses: civico-de/civikitchen/.github/workflows/extension-ci.yml@v1
# END CIVIKITCHEN MANAGED caller
    with:
      composer_install: true
      lifecycle: true
      extra_phpunit_config: phpunit-unit.xml.dist

  keycloak-e2e:
    name: Keycloak browser E2E
    uses: civico-de/civikitchen/.github/workflows/playwright-e2e.yml@v1
    with:
      working_directory: .
      cache_dependency_path: tests/e2e/keycloak/package-lock.json
      install_command: composer install --no-interaction --no-progress
      test_command: tests/e2e/keycloak/run.sh
      cleanup_command: docker compose -f .docker/docker-compose.keycloak.yml down --volumes --remove-orphans
      artifact_paths: |-
        tests/e2e/keycloak/playwright-report/
        tests/e2e/keycloak/test-results/
      timeout_minutes: 25

  entra-e2e:
    name: Entra profile browser E2E
    uses: civico-de/civikitchen/.github/workflows/playwright-e2e.yml@v1
    with:
      working_directory: .
      # No lockfile of its own: docker-compose.entra.yml copies the Keycloak
      # suite's package.json + package-lock.json into the Playwright container.
      cache_dependency_path: tests/e2e/keycloak/package-lock.json
      install_command: composer install --no-interaction --no-progress
      test_command: tests/e2e/entra/run.sh
      cleanup_command: docker compose -f .docker/docker-compose.entra.yml down --volumes --remove-orphans
      artifact_paths: |-
        tests/e2e/entra/playwright-report/
        tests/e2e/entra/test-results/
      timeout_minutes: 25
