$schema: https://raw.githubusercontent.com/civico-de/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json
version: 1
policy:
  # Expected values for ckconform.
  license: AGPL-3.0
  npm_license: AGPL-3.0
  copyright: 'civico GmbH'
  # Lowest CiviCRM minor info.xml may declare: the supported ESR.
  civicrm_floor: "6.16"

  # Ratchet up, never down to make a red build green.
  coverage:
    minimum: 90

  # Business hooks live in scan classes (AutoSubscriber/HookInterface); the
  # classic function form is reserved for pre-boot/lifecycle/return-value hooks.
  hook_style: listener
