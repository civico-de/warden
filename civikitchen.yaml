$schema: https://raw.githubusercontent.com/civico-de/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json
version: 1
policy:
  # Expected values for ckconform.
  license: AGPL-3.0
  npm_license: AGPL-3.0
  copyright: 'civico GmbH'

  # heraldChecks is herald's own hook, not a core one.
  known_hooks:
    - heraldChecks

  # Ratchet up, never down to make a red build green.
  coverage:
    minimum: 90

  # Business hooks live in scan classes (AutoSubscriber/HookInterface); the
  # classic function form is reserved for pre-boot/lifecycle/return-value hooks.
  hook_style: listener

  # Warden enables shared Composer/lifecycle inputs and CiviKitchen's standalone
  # Playwright workflow for its provider-specific Keycloak topology.
  template_custom:
    paths:
      - .github/workflows/ci.yml
    reason: 'Warden configures shared Composer, lifecycle and Keycloak E2E workflows'
